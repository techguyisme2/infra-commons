# Mirrors todo's gate: explicit defaults (E4/E7/E9/F) plus flake8-bandit (S).
# Explicit select, not extend-select — the gate must not change shape on a
# ruff bump. Formatting is deliberately not enforced (house convention).

target-version = "py312"
force-exclude = true

[lint]
select = ["E4", "E7", "E9", "F", "S"]

[lint.per-file-ignores]
# pytest suites: `assert` is the idiom; canary strings aren't secrets; the
# fake-tofu subprocess runs are the harness.
"tests/**" = ["S101", "S105", "S106", "S603"]
# The runner's job is fixed-argv tofu subprocesses.
"tofu_runner/**" = ["S603", "S607"]
